name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm start > /tmp/fast-dashboard-preview.log 2>&1 &
      - run: node -e "setTimeout(()=>fetch('http://127.0.0.1:4173').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1)), 3000)"
