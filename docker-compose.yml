services:
  api:
    build: .
    environment:
      API_PORT: 3030
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3030:3030"
    volumes:
      - ./data:/app/data

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm vite --host 0.0.0.0 --port 3000"
    environment:
      VITE_API_PROXY_TARGET: http://api:3030
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api
